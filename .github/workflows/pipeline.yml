name: DevSecOps end-to-end pipeline

on: 
  push:
        branches: [main]
    
jobs:

  code-quality:
        uses: ./.github/workflows/codelint.yml

  dependency-scan:
        uses: ./.github/workflows/dependencies.yml

  secrets-scan:
        uses: ./.github/workflows/secret_scanning.yml

  docker-lint:
        uses: ./.github/workflows/dockerfile-lint.yml

  build-push:
        needs: [code-quality, dependency-scan, secrets-scan, docker-lint]
        uses: ./.github/workflows/docker-build.yml
        secrets: inherit
      
    
